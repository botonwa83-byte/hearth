<p class="tagline">你说过的话，值得被写成一段文字。</p>

<p>Hearth 是一款在 Apple Watch 与 iPhone 上运行的个人生活记录工具：抬手记录，在设备本地转成文字，
并可选地整理成日记、回顾或一封写给某个人的信。没有账号，没有服务器，数据只在你的设备上。</p>
